thế hạ phong rõ rệt.'],['Cảnh 7 · Cao thủ tuyệt đỉnh','Đã bước vào lĩnh vực cấp Ngũ Tuyệt, chỉ dựa vào số đông đã rất khó bù đắp chênh lệch.'],['Cảnh 8 · Tông sư tuyệt đỉnh','Đứng trên đỉnh võ học đương thời, có thể tham chiếu Quách Tĩnh, Dương Quá, Chu Bá Thông thời hậu kỳ Thần Điêu.'],['Cảnh 9 · Truyền thuyết hóa cảnh','Tầng thứ truyền kỳ kiểu Độc Cô Cầu Bại, không dùng làm điểm cuối tăng trưởng thông thường của nhân vật thường.']],Oe=[['内功','Tổng lượng nội lực, mức độ tinh thuần, khả năng hồi phục, khả năng hộ thể, kỹ xảo vận kình, căn cơ kinh mạch.'],['招式','Mức độ tinh diệu của chiêu thức, biến hóa, khả năng tháo chiêu, lý luận võ học, hiểu biết binh khí.'],['轻功','Tốc độ di chuyển, biến hóa thân pháp, né tránh, đằng na, truy kích, thoát thân.'],['实战','Kinh nghiệm lâm địch, phán đoán, đảm lược, khả năng nắm sơ hở, thích ứng với võ công xa lạ.']],je=[['Cấp 1 · Sơ học','Nhớ được một phần khẩu quyết, động tác còn gượng gạo, dễ lộ sơ hở.'],['Cấp 2 · Nhập môn','Nắm vững phương pháp tu luyện đúng đắn, có thể thi triển đầy đủ nội dung cơ bản, biến hóa lâm địch còn hạn chế.'],['Cấp 3 · Tiểu thành','Có thể dùng trong chiến đấu thực sự, có thể biến hóa đơn giản theo tình hình, đa số đệ tử môn phái cả đời dừng ở đây.'],['Cấp 4 · Đại thành','Nắm vững cốt lõi của môn võ học này, chiêu thức, vận kình, hô hấp và bộ pháp hòa làm một, đủ để trở thành truyền nhân thực sự.'],['Cấp 5 · Viên thục','Gần như tùy tâm sở dục, có thể tự do phối hợp, bắt đầu hiểu nguyên lý võ học đằng sau chiêu thức, hình thành phong cách cá nhân.'],['Cấp 6 · Hóa dụng','Không câu nệ chiêu thức cũ, có thể tháo dỡ, biến hóa, tái tổ hợp, dung nhập võ học khác, cực ít tông sư đạt được.']],Ie=['Trong cùng một đại cảnh giới không có thắng bại tuyệt đối.','Chênh một đại cảnh, người cảnh cao có ưu thế rõ rệt, nhưng người cảnh thấp vẫn có thể dựa vào võ công khắc chế, kỳ chiêu, địa hình hoặc đánh lén để thắng; chênh hai đại cảnh, đối quyết chính diện đã là chênh lệch lớn; chênh từ ba trở lên, chiến đấu chính diện cơ bản không có phần thắng.','Số người không thể cộng đơn giản, võ giả cảnh thấp thiếu phối hợp rất khó vây chết cao thủ tuyệt đỉnh, trận pháp cao minh có thể khiến biểu hiện tổng thể vượt qua võ cảnh cá nhân.','Chiêu thức, binh khí, tính chất nội công, trận pháp, tình báo, tâm lý, môi trường đều có thể tạo thành khắc chế, nhưng khắc chế chỉ bù đắp được chênh lệch hữu hạn, không được phớt lờ chênh lệch tu vi nhiều cảnh.','Tiêu hao nội lực không dùng chế độ số liệu, chỉ dùng mô tả tự nhiên: sung mãn, bình ổn, có tiêu hao, tiêu hao rất lớn, khí tức rối loạn, gần cạn kiệt, dầu cạn đèn tắt.','Thương nhẹ cơ bản không ảnh hưởng, thương vừa giảm khoảng một tiểu giai đoạn, trọng thương giảm từ nửa đến hơn một đại cảnh; cao thủ cảnh 8 trọng thương rồi bị cảnh 6 đánh bại không trái với thiết lập.','Nhân vật trẻ không thể chỉ tu luyện vài tháng mà có được nội công mấy chục năm, tăng tiến bất thường trong thời gian ngắn cần có cơ duyên rõ ràng.'],Re=['Tích lũy nội công đạt chuẩn, võ học cốt lõi đạt mức nắm vững cao, đủ thực chiến hoặc lĩnh ngộ, thân tâm làm chủ được sức mạnh hiện tại, bốn điều kiện cùng chín muồi mới có thể đột phá.','Từ cảnh 5 trở đi mỗi lần thăng một đại cảnh càng lúc càng khó, sau cảnh 6 khổ luyện chưa chắc đã đạt được, từ cảnh 7 trở lên cần thiên phú, truyền thừa, trải nghiệm, ngộ tính và tích lũy lâu dài cùng tác động.','Cảnh 9 về nguyên tắc không dùng làm điểm cuối tăng trưởng thông thường, chỉ dùng cho nhân vật truyền kỳ kiểu Độc Cô Cầu Bại không thể khảo chứng giới hạn.'],Ae=['Áp dụng thang võ hiệp kiểu Kim Dung: cao thủ tuyệt đỉnh dốc toàn lực đề khí có thể lướt một hơi hơn mười trượng, mượn ngọn cây, nóc nhà, vách đá để đặt chân đổi hơi thì có thể nhanh chóng vượt qua địa hình mấy chục trượng, nhưng không thể lơ lửng giữa không hay bay liên tục mà không mượn lực, cũng không thể ngưng chân khí thành khối khí tồn tại lâu hay chuyển hướng truy người.','Cao thủ tuyệt đỉnh dốc toàn lực xuất thủ có thể chấn nứt đá lớn, bẻ gãy gỗ thô, hủy hoại binh khí thường, xuyên thủng trọng giáp hoặc phá hủy cục bộ kiến trúc gỗ đất, nhưng không thể một đòn san phẳng cả dãy nhà, tường thành và núi non.','Cao thủ tuyệt đỉnh có thể nhanh chóng phá vỡ một đoạn trận tuyến trong quân trận hoặc đánh xa tướng lĩnh, nhưng vẫn bị quân trận dày đặc, cung mạnh nỏ cứng và tiêu hao liên tục vây khốn; nội lực đỡ binh khí không có nghĩa là thân thể vốn đao thương bất nhập.','Tiêu thanh, trường khiếu và các loại âm công dựa vào âm thanh và nội lực để nhiễu loạn khí tức nhiều người, không tạo thành sóng khí nổ, cũng không chấn sát bừa bãi sinh linh ở xa.','Đàn Chỉ Thần Thông phần lớn dùng quân cờ, đá vụn, mảnh sắt và các vật thật để mang kình lực; chỉ phong tay không giới hạn ở gần, kình trực ngắn ngủi có thể bị né tránh, đỡ gạt hoặc vật che chắn chặn lại.','Lan Hoa Phất Huyệt Thủ cần áp sát nhận huyệt, Đàn Chỉ Thần Thông có thể điểm huyệt cách không; nội kình hộ thể, né tránh, đỡ gạt và mạnh yếu kinh mạch đều ảnh hưởng thành bại.','Cái gọi là “di huyệt” trong giang hồ là mượn bế tức, xoay người và vận kình để tránh yếu hại hoặc giảm nhẹ phong huyệt, không thể thực sự dời huyệt vị, cũng không thể thay thế giải huyệt.','Di Hồn Đại Pháp chỉ có thể dùng đối thị, ngôn ngữ và chuyên chú liên tục để nhiễu động tâm thần, không thể đoạt lấy tâm trí, sửa đổi nhân cách hay ép buộc quyết định; khi dùng để trị liệu chỉ có thể giúp an định cảm xúc, chạm tới ký ức rời rạc.'],Fe=['Võ công có số tầng tu luyện rõ ràng thì giữ nguyên số tầng gốc, ví dụ Long Tượng Ban Nhược Công mười ba tầng, không được ép đổi thành sáu tầng.','Võ học kiểu hệ thống như Cửu Âm Chân Kinh cần ghi riêng mức nắm vững từng thiên; có được bí kíp không có nghĩa là lập tức có toàn bộ sức mạnh.','Võ công tuyệt thế chỉ nâng tiềm lực và thủ đoạn, không trực tiếp ban cảnh giới; nhân vật cảnh 3 có được Cửu Âm Chân Kinh vẫn là cảnh 3.','Bản thân nhân vật quyết định uy lực võ công; tông sư cảnh 8 dùng quyền cước thường cũng có thể dựa vào nội lực, nhãn lực và kinh nghiệm để áp chế võ giả cảnh thấp.','Thần Chiếu Kinh có thể truyền thụ bằng cách truyền miệng khẩu quyết, giảng giải thứ tự hành công và dẫn dắt kinh mạch; người được dạy vẫn phải tự mình tu luyện, tiến cảnh phụ thuộc vào căn cốt, ngộ tính, thời gian và sự chỉ dạy, không thể trực tiếp sao chép cảnh giới của người truyền thụ.','Thần Chiếu Kinh đặc biệt giỏi hộ tâm, tục mạch và liệu thương; sau khi dung hội quán thông pháp môn liệu thương, có thể chữa nội thương cho thương giả còn một tia sinh cơ, tăng tốc gân cốt lành lại và trừ bỏ đa số độc lực thường, không để lại ám thương hay phản phệ do Thần Chiếu chân khí gây ra.','Thần Chiếu Kinh cứu trị thương thế cực nặng cần tiếp xúc kinh mạch thương giả và vận công liên tục, có thể tạm thời hao cạn nội lực của người thi thuật, nhưng không tổn hại căn cơ; dược vật, chính cốt, giải huyệt và y thuật là thủ đoạn phụ trợ để xử lý dị vật, cốt vị, huyệt đạo và kỳ độc hiếm gặp, không phải điều kiện tiên quyết để cứu được nội ngoại thương thông thường.','Pháp môn liệu thương và nội công cốt lõi của Thần Chiếu Kinh cần đánh giá riêng; sau khi quan khiếu cuối cùng quán thông, thần công đại thành, mới mở khóa giới hạn nội lực, hồi khí và cứu mạng tương ứng, không thể chỉ dựa vào độ thuần thục liệu thương mà coi là toàn công đại thành.'],Ue={class:'martial-guide'},He={class:'martial-guide-body'},qe={class:'martial-guide-header'},We={class:'martial-guide-heading'},Ge={class:'martial-guide-tabs',role:'tablist','aria-label':'Phân loại giải thích cảnh giới'},Je=['id','aria-selected','tabindex','onClick','onKeydown'],Ke=['aria-labelledby'],Ye={class:'realm-scale'},Xe=['value'],Ze={class:'guide-definitions'},Qe={class:'mastery-scale'},et=['value'],tt={key:3,class:'guide-points'},at={key:4,class:'guide-points'},nt={key:5,class:'guide-points'},ot={key:6,class:'guide-points'},rt=(0,r.defineComponent)({__name:'MartialGuideDialog',setup(e){const t=(0,r.ref)(),a=(0,r.ref)(),o=(0,r.ref)(),l=(0,r.ref)(),i=(0,r.ref)('realm'),s=(0,r.computed)(()=>Te.find(e=>e.id===i.value)?.label??'Cảnh
